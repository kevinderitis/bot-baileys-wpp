<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel Admin - WhatsApp Bot</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f6;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #64748b;
      --line: #d8dee6;
      --soft: #f8fafc;
      --accent: #128c7e;
      --accent-dark: #0c6f64;
      --danger: #c2410c;
      --success: #15803d;
      --warning: #b7791f;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      background: #111827;
      color: white;
      border-bottom: 4px solid var(--accent);
    }

    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1, h2 {
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      font-size: 22px;
      font-weight: 750;
    }

    h2 {
      font-size: 17px;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      gap: 20px;
      grid-template-columns: minmax(330px, 430px) minmax(0, 1fr);
      align-items: start;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-title {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    form {
      padding: 18px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      margin-bottom: 7px;
    }

    input, textarea, select, button {
      font: inherit;
    }

    input, textarea, select {
      display: block;
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text);
      background: white;
      padding: 10px 11px;
      outline: none;
    }

    input[type="datetime-local"],
    input[type="time"] {
      max-width: 100%;
      appearance: auto;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(18, 140, 126, 0.12);
    }

    textarea {
      min-height: 132px;
      resize: vertical;
      line-height: 1.45;
    }

    select {
      min-height: 160px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 13px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-weight: 720;
      white-space: nowrap;
    }

    button:hover { background: var(--accent-dark); }
    button:disabled { cursor: not-allowed; opacity: 0.55; }

    .button-secondary { background: #334155; }
    .button-secondary:hover { background: #1e293b; }
    .button-danger { background: var(--danger); }
    .button-danger:hover { background: #9a3412; }
    .button-ghost { background: transparent; color: #334155; border: 1px solid var(--line); }
    .button-ghost:hover { background: var(--soft); }

    .field {
      margin-bottom: 16px;
      min-width: 0;
    }

    .field-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
      min-width: 0;
    }

    .weekly-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 112px;
      gap: 12px;
      min-width: 0;
    }

    .date-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfdff;
      min-width: 0;
    }

    .date-box + .date-box {
      margin-top: 12px;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, minmax(38px, 1fr));
      gap: 6px;
      min-width: 0;
    }

    .weekday {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 8px 4px;
      text-align: center;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      font-weight: 720;
      margin: 0;
    }

    .weekday input { display: none; }

    .weekday:has(input:checked) {
      border-color: var(--accent);
      background: rgba(18, 140, 126, 0.1);
      color: var(--accent-dark);
    }

    .actions, .row-actions {
      display: flex;
      gap: 9px;
      align-items: center;
      flex-wrap: wrap;
    }

    .row-actions button {
      padding: 7px 9px;
      font-size: 13px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #cbd5e1;
      font-size: 14px;
      white-space: nowrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--warning);
    }

    .dot.online { background: #22c55e; }
    .dot.offline { background: #f59e0b; }

    .message {
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
      min-height: 20px;
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 760px;
    }

    th, td {
      border-top: 1px solid var(--line);
      padding: 12px 14px;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: var(--soft);
    }

    .message-cell {
      max-width: 280px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 760;
      background: #e2e8f0;
      color: #334155;
      white-space: nowrap;
    }

    .badge.pending { background: #fef3c7; color: #92400e; }
    .badge.sending { background: #dbeafe; color: #1d4ed8; }
    .badge.sent { background: #dcfce7; color: var(--success); }
    .badge.failed { background: #fee2e2; color: #b91c1c; }
    .badge.canceled { background: #e5e7eb; color: #4b5563; }

    .muted {
      color: var(--muted);
    }

    .empty {
      padding: 22px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 920px) {
      main {
        grid-template-columns: 1fr;
        padding: 16px;
      }
    }

    @media (max-width: 520px) {
      .header-inner {
        align-items: flex-start;
        flex-direction: column;
        padding: 16px;
      }

      .weekly-grid {
        grid-template-columns: 1fr;
      }

      .weekdays {
        grid-template-columns: repeat(4, minmax(48px, 1fr));
      }

      button {
        width: 100%;
      }

      .row-actions button {
        width: auto;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>Panel Admin</h1>
      <div class="status"><span id="statusDot" class="dot offline"></span><span id="statusText">Conectando...</span></div>
    </div>
  </header>

  <main>
    <section>
      <div class="section-title">
        <h2 id="formTitle">Nuevo envio</h2>
      </div>
      <form id="scheduleForm">
        <div class="field" id="tokenField" hidden>
          <label for="token">Token admin</label>
          <input id="token" name="token" type="password" autocomplete="current-password">
        </div>

        <div class="field">
          <label for="groups">Grupos</label>
          <select id="groups" name="groups" multiple required></select>
        </div>

        <div class="field">
          <label for="message">Mensaje</label>
          <textarea id="message" name="message" required>Hola! Como va? Paso por aca para dejarles un aviso rapido.</textarea>
        </div>

        <div class="field-grid">
          <div class="date-box">
            <label for="scheduledAt">Fecha y hora puntual</label>
            <input id="scheduledAt" name="scheduledAt" type="datetime-local">
          </div>

          <div class="date-box" id="weeklyBox">
            <div class="weekly-grid">
              <div>
                <label>Proximos dias</label>
                <div class="weekdays">
                  <label class="weekday"><input type="checkbox" value="1">Lun</label>
                  <label class="weekday"><input type="checkbox" value="2">Mar</label>
                  <label class="weekday"><input type="checkbox" value="3">Mie</label>
                  <label class="weekday"><input type="checkbox" value="4">Jue</label>
                  <label class="weekday"><input type="checkbox" value="5">Vie</label>
                  <label class="weekday"><input type="checkbox" value="6">Sab</label>
                  <label class="weekday"><input type="checkbox" value="0">Dom</label>
                </div>
              </div>
              <div>
                <label for="weeklyTime">Hora</label>
                <input id="weeklyTime" name="weeklyTime" type="time">
              </div>
            </div>
          </div>
        </div>

        <div class="actions" style="margin-top:16px">
          <button id="submitButton" type="submit">Programar mensajes</button>
          <button class="button-ghost" type="button" id="cancelEditButton" hidden>Cancelar edicion</button>
          <button class="button-secondary" type="button" id="refreshButton">Actualizar</button>
        </div>
        <div id="formMessage" class="message"></div>
      </form>
    </section>

    <section>
      <div class="section-title">
        <h2>Programaciones</h2>
        <div class="toolbar">
          <button class="button-secondary" type="button" id="reloadSchedules">Recargar</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Estado</th>
              <th>Grupo</th>
              <th>Fecha</th>
              <th>Mensaje</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="schedulesBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty" hidden>No hay mensajes programados.</div>
    </section>
  </main>

  <script>
    const state = {
      token: localStorage.getItem('adminToken') || '',
      groups: [],
      schedules: [],
      editingId: null,
    };

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const tokenField = document.getElementById('tokenField');
    const tokenInput = document.getElementById('token');
    const groupsSelect = document.getElementById('groups');
    const form = document.getElementById('scheduleForm');
    const formTitle = document.getElementById('formTitle');
    const formMessage = document.getElementById('formMessage');
    const schedulesBody = document.getElementById('schedulesBody');
    const emptyState = document.getElementById('emptyState');
    const submitButton = document.getElementById('submitButton');
    const cancelEditButton = document.getElementById('cancelEditButton');
    const weeklyBox = document.getElementById('weeklyBox');
    const scheduledAtInput = document.getElementById('scheduledAt');
    const weeklyTimeInput = document.getElementById('weeklyTime');
    const messageInput = document.getElementById('message');

    tokenInput.value = state.token;

    function headers() {
      return state.token
        ? { 'Content-Type': 'application/json', 'x-admin-token': state.token }
        : { 'Content-Type': 'application/json' };
    }

    async function request(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: { ...headers(), ...(options.headers || {}) },
      });

      if (response.status === 401) {
        tokenField.hidden = false;
        throw new Error('Ingresa el token admin para continuar.');
      }

      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Error inesperado');
      return data;
    }

    function formatDate(value) {
      return new Intl.DateTimeFormat('es-AR', {
        dateStyle: 'short',
        timeStyle: 'short',
      }).format(new Date(value));
    }

    function toDateTimeLocal(value) {
      const date = new Date(value);
      const offset = date.getTimezoneOffset();
      const local = new Date(date.getTime() - offset * 60000);
      return local.toISOString().slice(0, 16);
    }

    function setMessage(text, isError = false) {
      formMessage.textContent = text;
      formMessage.style.color = isError ? '#b91c1c' : '#64748b';
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function setEditing(schedule) {
      state.editingId = schedule.id;
      formTitle.textContent = 'Editar envio';
      submitButton.textContent = 'Guardar cambios';
      cancelEditButton.hidden = false;
      weeklyBox.hidden = true;
      messageInput.value = schedule.message;
      scheduledAtInput.value = toDateTimeLocal(schedule.scheduledAt);

      for (const option of groupsSelect.options) {
        option.selected = option.value === schedule.groupJid;
      }

      document.querySelectorAll('.weekday input').forEach(input => { input.checked = false; });
      weeklyTimeInput.value = '';
      form.scrollIntoView({ behavior: 'smooth', block: 'start' });
      setMessage('Editando una programacion existente.');
    }

    function clearEditing() {
      state.editingId = null;
      formTitle.textContent = 'Nuevo envio';
      submitButton.textContent = 'Programar mensajes';
      cancelEditButton.hidden = true;
      weeklyBox.hidden = false;
      scheduledAtInput.value = '';
      document.querySelectorAll('.weekday input').forEach(input => { input.checked = false; });
      weeklyTimeInput.value = '';
      setMessage('');
    }

    async function loadStatus() {
      try {
        const data = await request('/api/admin/status');
        statusDot.className = `dot ${data.connected ? 'online' : 'offline'}`;
        statusText.textContent = data.connected ? 'WhatsApp conectado' : 'WhatsApp no conectado';
        tokenField.hidden = !data.protected;
      } catch (err) {
        statusDot.className = 'dot offline';
        statusText.textContent = err.message;
      }
    }

    async function loadGroups() {
      const data = await request('/api/admin/groups');
      const selected = new Set(Array.from(groupsSelect.selectedOptions).map(option => option.value));
      state.groups = data.groups;
      groupsSelect.innerHTML = '';

      if (data.groups.length === 0) {
        const option = document.createElement('option');
        option.textContent = data.connected ? 'No hay grupos disponibles' : 'Conecta WhatsApp para ver grupos';
        option.disabled = true;
        groupsSelect.appendChild(option);
        return;
      }

      for (const group of data.groups) {
        const option = document.createElement('option');
        option.value = group.jid;
        option.textContent = `${group.name} (${group.participants})`;
        option.selected = selected.has(group.jid);
        groupsSelect.appendChild(option);
      }
    }

    async function loadSchedules() {
      const data = await request('/api/admin/schedules');
      state.schedules = data.schedules;
      schedulesBody.innerHTML = '';
      emptyState.hidden = data.schedules.length > 0;

      for (const schedule of data.schedules) {
        const editable = ['pending', 'failed', 'canceled'].includes(schedule.status);
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><span class="badge ${schedule.status}">${schedule.status}</span></td>
          <td>${escapeHtml(schedule.groupName)}</td>
          <td>${formatDate(schedule.scheduledAt)}</td>
          <td class="message-cell">${escapeHtml(schedule.message.slice(0, 180))}</td>
          <td><div class="row-actions"></div></td>
        `;

        const actions = row.querySelector('.row-actions');
        if (editable) {
          const editButton = document.createElement('button');
          editButton.type = 'button';
          editButton.className = 'button-ghost';
          editButton.textContent = 'Editar';
          editButton.addEventListener('click', () => setEditing(schedule));
          actions.appendChild(editButton);
        }

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'button-danger';
        deleteButton.textContent = 'Eliminar';
        deleteButton.addEventListener('click', () => deleteSchedule(schedule.id));
        actions.appendChild(deleteButton);

        schedulesBody.appendChild(row);
      }
    }

    async function refreshAll() {
      try {
        await loadStatus();
        await loadGroups();
        await loadSchedules();
        setMessage('Panel actualizado.');
      } catch (err) {
        setMessage(err.message, true);
      }
    }

    async function deleteSchedule(id) {
      if (!confirm('Eliminar esta programacion?')) return;

      try {
        await request(`/api/admin/schedules/${id}`, { method: 'DELETE' });
        if (state.editingId === id) clearEditing();
        await loadSchedules();
        setMessage('Programacion eliminada.');
      } catch (err) {
        setMessage(err.message, true);
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      state.token = tokenInput.value.trim();
      localStorage.setItem('adminToken', state.token);

      const groupJids = Array.from(groupsSelect.selectedOptions).map(option => option.value);
      const weekdays = Array.from(document.querySelectorAll('.weekday input:checked')).map(input => Number(input.value));
      const message = messageInput.value;
      const scheduledAt = scheduledAtInput.value;
      const weeklyTime = weeklyTimeInput.value;

      submitButton.disabled = true;
      setMessage(state.editingId ? 'Guardando cambios...' : 'Creando programaciones...');

      try {
        if (state.editingId) {
          const groupJid = groupJids[0];
          await request(`/api/admin/schedules/${state.editingId}`, {
            method: 'PUT',
            body: JSON.stringify({ groupJid, message, scheduledAt }),
          });
          clearEditing();
          await loadSchedules();
          setMessage('Programacion actualizada.');
        } else {
          const data = await request('/api/admin/schedules', {
            method: 'POST',
            body: JSON.stringify({ groupJids, message, scheduledAt, weekdays, weeklyTime }),
          });
          await loadSchedules();
          setMessage(`${data.schedules.length} mensaje(s) programado(s).`);
        }
      } catch (err) {
        setMessage(err.message, true);
      } finally {
        submitButton.disabled = false;
      }
    });

    document.getElementById('refreshButton').addEventListener('click', refreshAll);
    document.getElementById('reloadSchedules').addEventListener('click', loadSchedules);
    cancelEditButton.addEventListener('click', clearEditing);
    tokenInput.addEventListener('change', () => {
      state.token = tokenInput.value.trim();
      localStorage.setItem('adminToken', state.token);
      refreshAll();
    });

    refreshAll();
    setInterval(loadStatus, 10000);
    setInterval(loadSchedules, 15000);
  </script>
</body>
</html>
